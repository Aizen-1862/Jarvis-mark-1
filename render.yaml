services:
  - type: web
    name: jarvis
    runtime: python
    buildCommand: echo "JARVIS uses only the Python standard library"
    startCommand: python jarvis.py
    healthCheckPath: /healthz
    envVars:
      - key: JARVIS_HOST
        value: 0.0.0.0
      - key: JARVIS_NO_BROWSER
        value: "1"
      - key: JARVIS_ACCESS_PASSWORD
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
