<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #02060c;
    --cyan: #3fd8ff;
    --glow: rgba(63, 216, 255, 0.35);
    --amber: #ffb347;
    --red: #ff5a5f;
    --text: #d9f6ff;
    --muted: #6f93a6;
    --panel: rgba(10, 30, 45, 0.55);
    --accent: var(--cyan);
  }
  body.mode-egirl { --bg: #160b19; --cyan: #ff8bda; --glow: rgba(255,139,218,.38); --accent: #ff8bda; --panel: rgba(40,13,40,.62); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at center, #062033 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(63, 216, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63, 216, 255, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 18px 26px;
    font-family: "Orbitron", sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .pill { display: inline-flex; align-items: center; gap: 8px; margin-right: 22px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .dot.off { background: var(--red); box-shadow: 0 0 10px var(--red); }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding-bottom: 120px;
  }
  h1 {
    margin: 0;
    padding-left: 0.5em;
    font-family: "Orbitron", sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 3vw, 34px);
    letter-spacing: 0.5em;
    color: var(--cyan);
    text-shadow: 0 0 18px var(--glow);
  }
  .sub { margin-top: -14px; font-size: 12px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
  .reactor { position: relative; width: min(42vh, 360px); aspect-ratio: 1; cursor: pointer; --level: 0; }
  .ring { position: absolute; border-radius: 50%; }
  .r1 { inset: 0; border: 2px dashed var(--accent); opacity: 0.45; animation: spin 24s linear infinite; }
  .r2 { inset: 7%; border: 3px solid transparent; border-top-color: var(--accent); border-bottom-color: var(--accent); opacity: 0.75; animation: spin 9s linear infinite reverse; }
  .r3 { inset: 15%; border: 1px solid var(--accent); opacity: 0.35; }
  .r4 { inset: 20%; border: 6px solid transparent; border-left-color: var(--accent); border-right-color: var(--accent); opacity: 0.6; animation: spin 5s linear infinite; }
  .core {
    position: absolute;
    inset: 31%;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, var(--accent) 35%, rgba(63, 216, 255, 0.15) 70%, transparent 72%);
    box-shadow: 0 0 calc(30px + var(--level) * 90px) var(--accent), inset 0 0 30px rgba(255, 255, 255, 0.4);
    transform: scale(calc(1 + var(--level) * 0.35));
    transition: transform 0.06s linear, box-shadow 0.06s linear;
  }
  .state-listening { --accent: #7ff3ff; }
  .state-listening .r2 { animation-duration: 2.5s; }
  .state-listening .r4 { animation-duration: 1.6s; }
  .state-listening .core { animation: breathe 1s ease-in-out infinite; }
  .state-thinking { --accent: var(--amber); }
  .state-thinking .r2, .state-thinking .r4 { animation-duration: 1.2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { filter: brightness(1.35); } }
  .status {
    min-height: 18px;
    font-family: "Orbitron", sans-serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .log {
    width: min(760px, 92vw);
    min-height: 86px;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid rgba(63, 216, 255, 0.18);
    border-radius: 14px;
    backdrop-filter: blur(6px);
  }
  .line { margin: 2px 0; font-size: 19px; line-height: 1.4; }
  .who { margin-right: 10px; font-family: "Orbitron", sans-serif; font-size: 11px; letter-spacing: 0.25em; color: var(--muted); }
  .you .txt { color: #a9c7d6; }
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
  }
  .hint { font-size: 15px; letter-spacing: 0.08em; color: var(--muted); }
  kbd { padding: 2px 7px; border: 1px solid var(--muted); border-radius: 5px; font-family: "Orbitron", sans-serif; font-size: 11px; color: var(--text); }
  form { display: flex; gap: 8px; width: min(560px, 92vw); }
  input {
    flex: 1;
    padding: 10px 14px;
    background: rgba(5, 18, 28, 0.8);
    border: 1px solid rgba(63, 216, 255, 0.25);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: var(--cyan); }
  button {
    padding: 0 16px;
    background: transparent;
    border: 1px solid var(--cyan);
    border-radius: 10px;
    color: var(--cyan);
    font-family: "Orbitron", sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    cursor: pointer;
  }
  .credit { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
  .toast {
    position: fixed;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    display: none;
    max-width: 90vw;
    padding: 10px 16px;
    background: rgba(40, 12, 14, 0.92);
    border: 1px solid var(--red);
    border-radius: 10px;
    color: #ffd6d6;
    font-size: 15px;
    z-index: 5;
  }
  .generated-image { display:block; max-width:min(520px,100%); max-height:54vh; margin:14px 0 0; border:1px solid var(--accent); border-radius:14px; box-shadow:0 0 24px var(--glow); }
  .action-link { display:inline-block; margin:10px 0 0; padding:9px 14px; border:1px solid var(--accent); border-radius:10px; color:var(--text); text-decoration:none; }
  .wake {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(1, 5, 10, 0.88);
    cursor: pointer;
    font-family: "Orbitron", sans-serif;
    letter-spacing: 0.4em;
    color: var(--cyan);
    text-align: center;
  }
  .wake small { font-family: "Rajdhani", sans-serif; font-size: 14px; letter-spacing: 0.15em; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .ring, .core { animation: none !important; } }
</style>
</head>
<body class="state-idle">
  <div class="wake" id="wake">CLICK TO WAKE J.A.R.V.I.S.<small>Your browser needs one click before he can speak</small></div>

  <header>
    <div>
      <span class="pill"><span class="dot" id="dotVoice"></span>VOICE &middot; FISH AUDIO</span>
      <span class="pill"><span class="dot" id="dotBrain"></span>BRAIN &middot; OPENROUTER</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><a href="/lab.html" style="color:#3fd8ff;text-decoration:none;border:1px solid rgba(63,216,255,.35);border-radius:5px;padding:7px 10px;font-size:11px;letter-spacing:.08em">3D LEARNING LAB ↗</a><div id="clock"></div></div>
  </header>

  <main>
    <h1>J.A.R.V.I.S.</h1>
    <div class="sub">Just A Rather Very Intelligent System</div>
    <div class="reactor" id="reactor" title="Click to talk">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="ring r4"></div>
      <div class="core"></div>
    </div>
    <div class="status" id="status">Standing by</div>
    <div class="log" id="log"></div>
  </main>

  <footer>
    <div class="hint">Hold <kbd>SPACE</kbd> or click the core to talk</div>
    <form id="typeForm">
      <input id="typeBox" placeholder="Or type to JARVIS..." autocomplete="off">
      <button type="submit">SEND</button>
    </form>
    <div class="credit">Voice by Fish Audio &middot; Brain by OpenRouter</div>
  </footer>

  <div class="toast" id="toast"></div>
  <audio id="voice"></audio>

<script>
  const $ = (id) => document.getElementById(id);
  const reactor = $('reactor');
  const statusEl = $('status');
  const logEl = $('log');
  const voice = $('voice');
  const typeBox = $('typeBox');
  const LABELS = { idle: 'Standing by', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking' };
  let calls = 'sir';
  let protocols = [];
  let googleClientId = '';
  let busy = false;

  function setState(state) {
    document.body.classList.remove('state-idle', 'state-listening', 'state-thinking', 'state-speaking');
    document.body.classList.add('state-' + state);
    statusEl.textContent = LABELS[state];
  }

  function addLine(cls, who, text) {
    const line = document.createElement('div');
    line.className = 'line ' + cls;
    const whoEl = document.createElement('span');
    whoEl.className = 'who';
    whoEl.textContent = who;
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = text;
    line.append(whoEl, txt);
    logEl.append(line);
    return txt;
  }

  function showExchange(you, jarvis) {
    logEl.innerHTML = '';
    if (you) addLine('you', 'YOU', you);
    if (jarvis) addLine('jarvis', 'JARVIS', jarvis);
  }

  let toastTimer;
  function toast(message) {
    const el = $('toast');
    el.textContent = message;
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.display = 'none'; }, 8000);
  }

  setInterval(() => {
    $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }, 1000);

  async function loadStatus() {
    try {
      const s = await (await fetch('/api/status')).json();
      calls = s.calls || 'sir';
      protocols = Array.isArray(s.protocols) ? s.protocols : [];
      googleClientId = s.google_client_id || '';
      document.body.classList.toggle('mode-egirl', s.mode === 'egirl');
      $('dotVoice').className = 'dot ' + (s.voice ? 'on' : 'off');
      $('dotBrain').className = 'dot ' + (s.brain ? 'on' : 'off');
      if (!s.brain) toast('No brain key yet. Add your OpenRouter key to the .env file and restart JARVIS.');
    } catch {
      toast('Lost contact with JARVIS. Is the JARVIS window still open?');
    }
  }
  loadStatus();

  // ---- voice output + audio-reactive core
  let audioCtx = null;
  let analyser = null;
  let samples = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(voice);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      samples = new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch {
      analyser = null;
    }
    requestAnimationFrame(meter);
  }
  function meter() {
    let level = 0;
    if (analyser && !voice.paused) {
      analyser.getByteTimeDomainData(samples);
      let sum = 0;
      for (const v of samples) { const x = (v - 128) / 128; sum += x * x; }
      level = Math.min(1, Math.sqrt(sum / samples.length) * 4);
    }
    reactor.style.setProperty('--level', level.toFixed(3));
    requestAnimationFrame(meter);
  }

  let speakToken = 0;
  let speakAbort = null;
  function stopSpeaking() {
    speakToken += 1;
    if (speakAbort) speakAbort.abort();
    speakAbort = null;
    voice.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  function backupVoice(text) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window)) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }
  async function speak(text) {
    const token = ++speakToken;
    setState('speaking');
    try {
      const r = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) {
        let message = 'The Fish Audio voice is unavailable, so JARVIS is using the backup voice.';
        try { message = (await r.json()).error || message; } catch {}
        throw new Error(message);
      }
      const blob = await r.blob();
      if (token !== speakToken) return;
      if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
      const src = URL.createObjectURL(blob);
      voice.src = src;
      await voice.play();
      await new Promise((resolve) => { voice.onpause = resolve; voice.onerror = resolve; });
      URL.revokeObjectURL(src);
    } catch (err) {
      if (token !== speakToken) return;
      toast(err.message);
      await backupVoice(text);
    }
    if (token === speakToken) setState('idle');
  }

  function imageRequest(text) {
    const match = text.match(/^\s*(?:please\s+)?(?:generate|create|draw|make)\s+(?:me\s+)?(?:an?\s+)?(?:image|picture|photo|illustration|logo)\s*(?:of|for|showing)?\s*(.*)$/i);
    return match ? match[1].trim() || text.trim() : '';
  }

  function isActionRequest(text) {
    const command = /^(?:please\s+)?(?:(?:can|could)\s+you\s+)?(?:please\s+)?(?:open|launch|start|run|play|check|read|summari[sz]e|review|show|fetch|retrieve|turn\s+on|turn\s+off|set|stop|pause|resume|skip|generate|create|draw|make)\b/i;
    const normalized = text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    return command.test(text) || protocols.some((phrase) => normalized.includes(String(phrase).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim()));
  }

  async function streamReply(text, replyEl) {
    const token = ++speakToken;
    speakAbort = new AbortController();
    let speechQueue = Promise.resolve();
    let speechGenerationQueue = Promise.resolve();
    let pendingSpeech = '';
    const queueSpeech = (chunk) => {
      const audioPromise = speechGenerationQueue.then(async () => {
        const response = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: chunk }),
          signal: speakAbort.signal,
        });
        if (!response.ok) {
          let message = 'Fish Audio voice is unavailable.';
          try { message = (await response.json()).error || message; } catch {}
          throw new Error(message);
        }
        return response.blob();
      });
      speechGenerationQueue = audioPromise.then(() => {}, () => {});
      speechQueue = speechQueue.then(async () => {
        if (token !== speakToken) return;
        try {
          const blob = await audioPromise;
          if (token !== speakToken) return;
          if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
          const src = URL.createObjectURL(blob);
          voice.src = src;
          setState('speaking');
          try {
            await new Promise((resolve, reject) => {
              voice.onended = resolve;
              voice.onerror = resolve;
              voice.onpause = () => { if (token !== speakToken) resolve(); };
              voice.play().catch(reject);
            });
          } finally {
            URL.revokeObjectURL(src);
          }
        } catch (err) {
          if (token !== speakToken) return;
          toast(err.message || 'Fish Audio voice is unavailable. Using the backup voice.');
          await backupVoice(chunk);
        }
      });
    };
    const acceptText = (piece) => {
      replyEl.textContent += piece;
      pendingSpeech += piece;
      let match;
      const sentence = /[.!?](?:["')\]]*)\s+/;
      while ((match = sentence.exec(pendingSpeech))) {
        const chunk = pendingSpeech.slice(0, match.index + match[0].length).trim();
        pendingSpeech = pendingSpeech.slice(match.index + match[0].length);
        if (chunk) queueSpeech(chunk);
      }
      if (pendingSpeech.length >= 160) {
        const cut = pendingSpeech.lastIndexOf(' ', 150);
        if (cut > 60) {
          queueSpeech(pendingSpeech.slice(0, cut).trim());
          pendingSpeech = pendingSpeech.slice(cut + 1);
        }
      }
    };

    const response = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!response.ok || !response.body) {
      let message = 'JARVIS could not start a streamed reply.';
      try { message = (await response.json()).error || message; } catch {}
      throw new Error(message);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let streamError = '';
    let done = false;
    while (!done) {
      const part = await reader.read();
      done = part.done;
      buffer += decoder.decode(part.value || new Uint8Array(), { stream: !done });
      let boundary;
      while ((boundary = buffer.indexOf('\n\n')) !== -1) {
        const event = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);
        for (const line of event.split('\n')) {
          if (!line.startsWith('data:')) continue;
          try {
            const data = JSON.parse(line.slice(5).trim());
            if (data.text) acceptText(data.text);
            if (data.error) streamError = data.error;
          } catch {}
        }
      }
    }
    if (pendingSpeech.trim()) queueSpeech(pendingSpeech.trim());
    if (streamError && !replyEl.textContent) replyEl.textContent = streamError;
    if (!replyEl.textContent) replyEl.textContent = streamError || 'I did not receive a reply.';
    busy = false;
    if (streamError) toast(streamError);
    await speechQueue;
    if (token === speakToken) setState('idle');
  }

  const phoneAppMap = {
    calculator: { android: true },
    notepad: { android: true },
    'file explorer': { android: true },
    paint: { android: true },
    spotify: { android: true, ios: 'spotify://' },
    youtube: { android: true, ios: 'youtube://' },
    'youtube music': { android: true },
    gmail: { android: true },
    chrome: { android: true },
    maps: { android: true, ios: 'maps://' },
    'google maps': { android: true, ios: 'maps://' },
    whatsapp: { android: true, ios: 'whatsapp://' },
    instagram: { android: true, ios: 'instagram://' },
    tiktok: { android: true },
    camera: { android: true },
    phone: { android: true, ios: 'tel:' },
    messages: { android: true, ios: 'sms:' },
    settings: { android: true },
    photos: { android: true },
    calendar: { android: true },
  };
  function phoneAppLink(app) {
    const name = app.toLowerCase().trim();
    const config = phoneAppMap[name];
    if (!config) return '';
    if (/Android/i.test(navigator.userAgent)) {
      if (!config.android) return '';
      const fallback = encodeURIComponent('https://jarvis-mark-1-k6sq.onrender.com/');
      return `intent://launch?app=${encodeURIComponent(name)}#Intent;scheme=jarvismobile;package=com.aizen.jarvismobile;S.browser_fallback_url=${fallback};end`;
    }
    return config.ios || '';
  }

  async function generateImage(prompt, replyEl) {
    replyEl.textContent = 'Generating your image… This may use OpenRouter credits.';
    setState('thinking');
    const response = await fetch('/api/images', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Image generation failed.');
    replyEl.textContent = data.cost == null ? 'Here is your image. OpenRouter did not report the cost.' : `Here is your image. OpenRouter reported a cost of $${Number(data.cost).toFixed(4)}.`;
    const image = document.createElement('img');
    image.className = 'generated-image';
    image.alt = prompt || 'Image generated by JARVIS';
    image.src = `data:${data.media_type || 'image/png'};base64,${data.image}`;
    replyEl.parentElement.append(image);
    busy = false;
    void speak('I created that image for you, sir.');
  }

  let gmailAccessToken = '';
  function requestGmailAccess() {
    if (!googleClientId) return Promise.reject(new Error('Gmail setup is incomplete: add GOOGLE_CLIENT_ID in Render and allow the JARVIS site as an authorized JavaScript origin.'));
    if (!window.google?.accounts?.oauth2) return Promise.reject(new Error('Google sign-in is still loading. Tap Connect Gmail again in a moment.'));
    return new Promise((resolve, reject) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: googleClientId,
        scope: 'https://www.googleapis.com/auth/gmail.readonly',
        callback: (result) => {
          if (result?.access_token) { gmailAccessToken = result.access_token; resolve(gmailAccessToken); }
          else reject(new Error(result?.error_description || result?.error || 'Gmail access was not granted.'));
        },
        error_callback: (error) => reject(new Error(error?.message || 'Google sign-in could not open.')),
      });
      client.requestAccessToken({ prompt: '' });
    });
  }

  async function gmailApi(url, token) {
    const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!response.ok) {
      if (response.status === 401) gmailAccessToken = '';
      throw new Error(response.status === 403 ? 'Google has not granted Gmail read access. Check the Gmail API and OAuth consent settings.' : `Gmail returned an error (${response.status}).`);
    }
    return response.json();
  }

  function decodeMailPart(data) {
    if (!data) return '';
    const base64 = data.replace(/-/g, '+').replace(/_/g, '/');
    const binary = atob(base64 + '='.repeat((4 - base64.length % 4) % 4));
    return new TextDecoder().decode(Uint8Array.from(binary, (char) => char.charCodeAt(0)));
  }

  function mailBody(payload) {
    const plain = [];
    const html = [];
    const visit = (part) => {
      if (!part) return;
      const body = part.body?.data;
      if (body && part.mimeType === 'text/plain') plain.push(decodeMailPart(body));
      else if (body && part.mimeType === 'text/html') html.push(decodeMailPart(body));
      for (const child of part.parts || []) visit(child);
    };
    visit(payload);
    if (plain.length) return plain.join('\n').replace(/\s+/g, ' ').trim().slice(0, 2500);
    if (html.length) {
      const doc = new DOMParser().parseFromString(html.join('\n'), 'text/html');
      doc.querySelectorAll('script,style').forEach((node) => node.remove());
      return (doc.body.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 2500);
    }
    return '';
  }

  function addGmailConnectButton(replyEl) {
    if (replyEl.parentElement.querySelector('.gmail-connect')) return;
    const button = document.createElement('button');
    button.className = 'action-link gmail-connect';
    button.type = 'button';
    button.textContent = 'Connect Gmail and read unread mail';
    button.addEventListener('click', async () => {
      button.disabled = true;
      try { await readWorkMail(replyEl, await requestGmailAccess()); }
      catch (error) { replyEl.textContent = error.message || 'Gmail connection failed.'; button.disabled = false; }
    });
    replyEl.parentElement.append(button);
  }

  async function readWorkMail(replyEl, token) {
    replyEl.textContent = 'Reading unread Gmail messages. Their content will be sent to OpenRouter to create the summary.';
    setState('thinking');
    let ids = [];
    let pageToken = '';
    while (ids.length < 200) {
      const params = new URLSearchParams({ q: 'is:unread in:inbox', maxResults: '100' });
      if (pageToken) params.set('pageToken', pageToken);
      const page = await gmailApi(`https://gmail.googleapis.com/gmail/v1/users/me/messages?${params}`, token);
      ids.push(...(page.messages || []).map((message) => message.id));
      pageToken = page.nextPageToken || '';
      if (!pageToken) break;
    }
    ids = ids.slice(0, 200);
    if (!ids.length) {
      replyEl.textContent = 'There are no unread messages in your inbox, sir.';
      busy = false;
      void speak(replyEl.textContent);
      return;
    }
    const messages = [];
    for (let i = 0; i < ids.length; i += 5) {
      const batch = await Promise.all(ids.slice(i, i + 5).map(async (id) => {
        const mail = await gmailApi(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(id)}?format=full`, token);
        const headers = mail.payload?.headers || [];
        const header = (name) => headers.find((item) => item.name?.toLowerCase() === name)?.value || '';
        return { from: header('from'), subject: header('subject'), date: header('date'), body: mailBody(mail.payload) || mail.snippet || '' };
      }));
      messages.push(...batch);
      replyEl.textContent = `Reading unread mail: ${messages.length} of ${ids.length} messages…`;
    }
    const summaries = [];
    for (let i = 0; i < messages.length; i += 10) {
      const response = await fetch('/api/summarize-mails', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages.slice(i, i + 10) }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'JARVIS could not summarize the mail.');
      summaries.push(data.reply);
      replyEl.textContent = `Unread mail summary (${Math.min(i + 10, messages.length)} of ${messages.length}):\n\n${summaries.join('\n\n')}`;
    }
    if (ids.length === 200) replyEl.textContent += '\n\nI checked the 200 most recent unread messages; there may be more.';
    busy = false;
    void speak(replyEl.textContent);
  }

  // ---- talking to the brain
  function launchNativeApp(app) {
    return new Promise((resolve) => {
      const requestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const finish = (result) => {
        window.removeEventListener('message', onMessage);
        clearTimeout(timeout);
        resolve(result);
      };
      const onMessage = (event) => {
        if (event.source !== window || event.origin !== location.origin) return;
        const message = event.data;
        if (message?.source !== 'JARVIS_BRIDGE' || message.requestId !== requestId) return;
        finish(message.result || { ok: false, error: 'No launch confirmation received.' });
      };
      // Windows may take several seconds to wake or launch a packaged app; don't
      // report a missing bridge while the native host is still completing launch.
      const timeout = setTimeout(() => finish({ ok: false, error: 'JARVIS Windows app bridge did not respond in time.' }), 15000);
      window.addEventListener('message', onMessage);
      window.postMessage({ source: 'JARVIS_PAGE', type: 'LAUNCH_APP', requestId, app }, location.origin);
    });
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    stopSpeaking();
    showExchange(text, '');
    setState('thinking');
    const replyEl = addLine('jarvis', 'JARVIS', '...');
    const requestsMail = /\b(?:activate|start|enable|turn\s+on)\s+work\s+mode\b|\b(?:check|read|summari[sz]e|review|show|fetch|retrieve|look\s+at)\b.*\b(?:e-?mails?|mails?|messages?|inbox)\b|\b(?:e-?mails?|mails?|messages?|inbox)\b.*\b(?:check|read|summari[sz]e|review|show|fetch|retrieve)\b/i.test(text);
    // Start OAuth while this is still directly inside the user's click/key action;
    // browsers may block the Google consent popup if we wait for the server first.
    const gmailAuthorization = requestsMail
      ? requestGmailAccess().then((token) => ({ token }), (error) => ({ error }))
      : null;
    try {
      const prompt = imageRequest(text);
      if (prompt) {
        await generateImage(prompt, replyEl);
        return;
      }
      if (!isActionRequest(text)) {
        replyEl.textContent = '';
        await streamReply(text, replyEl);
        return;
      }
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await r.json();
      let reply = data.reply || data.error || 'Something went wrong.';
      for (const app of data.launch_apps || []) {
        const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const href = mobile ? phoneAppLink(app) : '';
        if (href) {
          reply = `Tap below to open ${app} on your phone.`;
          const link = document.createElement('a');
          link.className = 'action-link';
          link.href = href;
          link.textContent = `Open ${app}`;
          link.rel = 'noopener';
          replyEl.parentElement.append(link);
        } else if (mobile) {
          reply = `I don't have a launch link for ${app} on this phone yet. Phone browsers can't list every installed app.`;
        } else {
          const result = await launchNativeApp(app);
          reply = result.ok ? `Opening ${app} now, sir.` : `I couldn't open ${app}: ${result.error || 'check the Windows app bridge and installed app name.'}`;
        }
      }
      replyEl.textContent = reply;
      document.body.classList.toggle('mode-egirl', data.mode === 'egirl');
      if (data.work_mode || (requestsMail && gmailAuthorization)) {
        const authorization = await gmailAuthorization;
        if (authorization?.token) {
          await readWorkMail(replyEl, authorization.token);
          return;
        }
        if (authorization?.error) {
          replyEl.textContent = authorization.error.message || 'Connect Gmail to read your mail.';
          addGmailConnectButton(replyEl);
          busy = false;
          setState('idle');
          return;
        }
      }
      for (const url of data.open || []) {
        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.style.cssText = 'display:inline-block;margin:6px 0 0 52px;color:var(--cyan);text-decoration:underline';
        try { link.textContent = 'Open ' + new URL(url).hostname; }
        catch { link.textContent = 'Open link'; }
        replyEl.parentElement.append(link);
        const opened = window.open(url, '_blank');
        if (!opened) {
          link.textContent = 'Click to open ' + link.textContent.replace(/^Open /, '');
          toast('Your browser blocked the new tab. Click JARVIS’s link to open it.');
        }
      }
      if (data.error) toast(reply);
      busy = false;
      // Don't hold up the response flow while Fish Audio generates and plays
      // the voice. The answer is already visible; speech can run in the
      // background and still be cancelled by the next interaction.
      void speak(reply);
    } catch (err) {
      replyEl.textContent = err?.message || 'I lost contact with the JARVIS server. Is the JARVIS window still open?';
      toast(replyEl.textContent);
      busy = false;
      setState('idle');
    }
  }

  // ---- voice input (built into Chrome and Edge)
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  let listening = false;
  let heard = '';
  let interim = '';
  function startListening() {
    if (busy || listening) return;
    if (!Recognition) {
      toast('Voice input needs Chrome or Edge. You can still type below.');
      return;
    }
    stopSpeaking();
    heard = '';
    interim = '';
    rec = new Recognition();
    rec.lang = 'en-US';
    rec.interimResults = true;
    rec.continuous = true;
    rec.onresult = (e) => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const result = e.results[i];
        if (result.isFinal) heard += result[0].transcript + ' ';
        else interim += result[0].transcript;
      }
      showExchange((heard + interim).trim() || '...', '');
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        toast('Microphone blocked. Click the icon at the left of the address bar and allow the microphone.');
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        toast('Voice input problem: ' + e.error);
      }
    };
    rec.onend = () => {
      listening = false;
      const said = (heard + interim).trim();
      if (said) send(said);
      else setState('idle');
    };
    try {
      rec.start();
      listening = true;
      setState('listening');
    } catch {
      listening = false;
    }
  }
  function stopListening() {
    if (rec && listening) {
      try { rec.stop(); } catch {}
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || e.repeat || e.target === typeBox) return;
    e.preventDefault();
    startListening();
  });
  document.addEventListener('keyup', (e) => {
    if (e.code !== 'Space' || e.target === typeBox) return;
    e.preventDefault();
    stopListening();
  });
  reactor.addEventListener('click', () => (listening ? stopListening() : startListening()));
  $('typeForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = typeBox.value;
    typeBox.value = '';
    typeBox.blur();
    send(text);
  });

  $('wake').addEventListener('click', () => {
    $('wake').remove();
    initAudio();
    const hour = new Date().getHours();
    const part = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
    const greeting = `Good ${part}, ${calls}. All systems are online.`;
    showExchange('', greeting);
    speak(greeting);
  });
</script>
</body>
